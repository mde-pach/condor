site_name: condor
site_description: A fast dead-code finder for Python, compatible with vulture.
site_url: https://mde-pach.github.io/condor/
repo_url: https://github.com/mde-pach/condor
repo_name: mde-pach/condor
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - Home: index.md
  - Improvements over vulture: improvements.md
  - Plugins: plugins.md
  - vulture compatibility: compatibility.md
  - Other differences: divergences.md
  - Results: results.md
  - Development: development.md
