site_name: condor
site_description: A fast dead-code finder for Python, compatible with vulture.
site_url: https://mde-pach.github.io/condor/
repo_url: https://github.com/mde-pach/condor
repo_name: mde-pach/condor
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - content.code.copy
    - navigation.sections
  # Dark first; the light scheme keeps the dark header.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Dark mode

extra_css:
  - stylesheets/condor.css

extra_javascript:
  - javascripts/hero.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - Home: index.md
  - Coming from vulture: vulture.md
  - Plugins: plugins.md
  - Results: results.md
  - Development: development.md
