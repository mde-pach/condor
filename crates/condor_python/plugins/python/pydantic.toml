[plugin]
name = "pydantic"
description = "Model fields are set by validation and read by serialisation; validators and serializers are called by pydantic."
when_imported = ["pydantic", "pydantic_settings"]

[[fields_used]]
inherits = ["pydantic.BaseModel", "pydantic.RootModel", "pydantic.v1.BaseModel", "pydantic_settings.BaseSettings"]
fields = "annotated"

[[fields_used]]
decorated_by = ["pydantic.dataclasses.dataclass"]
fields = "annotated"

[[used]]
decorated_by = [
    "pydantic.field_validator",
    "pydantic.model_validator",
    "pydantic.field_serializer",
    "pydantic.model_serializer",
    "pydantic.computed_field",
    "pydantic.validator",
    "pydantic.root_validator",
]
