[package]
name = "condor"
description = "A fast, vulture-compatible dead-code finder for Python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Distributed on PyPI as `cndr`; the crate names on crates.io are taken.
publish = false

[dependencies]
condor_core.workspace = true
condor_python.workspace = true
rayon.workspace = true
toml.workspace = true
ignore.workspace = true
serde_json.workspace = true
rustc-hash.workspace = true
lsp-server = "=0.10.0"
lsp-types = "=0.97.0"

[dev-dependencies]
serde_json.workspace = true

[[bin]]
name = "condor"
path = "src/main.rs"

[[bin]]
name = "cndr"
path = "src/bin/cndr.rs"

[target."cfg(unix)".dependencies]
libc = "0.2"
