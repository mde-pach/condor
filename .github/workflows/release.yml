name: Release

# Builds wheels and an sdist for every platform and publishes them to PyPI as
# `cndr`, through PyPI trusted publishing (environment `pypi`). Triggered by
# pushing a version tag that matches the crate version, e.g. v0.1.0, on a
# commit of main. Nothing is published unless the tests pass and the built
# wheels run.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The tag matches the crate version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main"; exit 1; }

  tests:
    needs: check-version
    uses: ./.github/workflows/ci.yml

  wheels:
    needs: check-version
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64, manylinux: auto }
          - { os: ubuntu-24.04, target: aarch64, manylinux: auto }
          - { os: ubuntu-24.04, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-24.04, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-15, target: x86_64 }
          - { os: macos-15, target: aarch64 }
          - { os: windows-2025, target: x64 }
          - { os: windows-2025, target: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Pinned by commit: this action builds what is published.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.16.0
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist

  sdist:
    needs: check-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.16.0
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  # Install the wheel built for each runner and run it on a small project.
  smoke:
    needs: wheels
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install and run
        shell: bash
        run: |
          uv venv --python 3.12 venv
          uv pip install --python venv --no-index --find-links dist cndr
          bin=venv/bin; [ -d venv/Scripts ] && bin=venv/Scripts
          "$bin/condor" --version
          "$bin/cndr" --version
          mkdir smoke && printf 'def used():\n    pass\n\ndef unused():\n    pass\n\nused()\n' > smoke/m.py
          set +e; "$bin/condor" smoke; code=$?; set -e
          test "$code" = 3 || { echo "expected exit 3, got $code"; exit 1; }

  publish:
    needs: [tests, wheels, sdist, smoke]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/cndr/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # Pinned by commit: this action uploads to PyPI.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
